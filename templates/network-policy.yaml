{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cross-ns-ssh
  namespace: {{ .Values.awx.namespace | default .Release.Namespace | quote }}
spec:
  podSelector:
    matchLabels:
      app: ssh-server
      app.kubernetes.io/component: awx
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: client-apps
      ports:
        - protocol: TCP
          port: 22
{{- end }}
