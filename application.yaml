apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: awx
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_ORG/YOUR_REPOSITORY.git
    targetRevision: HEAD
    path: k3s-awx-setup/AWX_helm2
  destination:
    server: https://kubernetes.default.svc
    namespace: awx
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
